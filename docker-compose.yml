services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: taskmanagement-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-Your_strong_password123}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # sql server takes ~20-30s to start, the api waits for this check
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: .
    container_name: taskmanagement-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=TaskManagementDb;User Id=sa;Password=${SA_PASSWORD:-Your_strong_password123};TrustServerCertificate=True"
      Jwt__Secret: ${JWT_SECRET:-docker-dev-secret-please-change-this-value-123}
      Seed__AdminPassword: ${ADMIN_PASSWORD:-Admin123!}
      Seed__DemoData: ${SEED_DEMO_DATA:-false}
    ports:
      - "5000:8080"
    volumes:
      - ./logs:/app/logs

volumes:
  sqlserver-data:
